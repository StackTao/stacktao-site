server {
    listen 80;
    server_name stacktao.cn;
    root /srv/stacktao/data/site/dist;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/stacktao.cn; }
    location / { return 301 https://stacktao.cn$request_uri; }
}
server {
    listen 443 ssl;
    server_name stacktao.cn;
    root /srv/stacktao/data/site/dist;
    index index.html;
    ssl_certificate /www/server/panel/vhost/cert/stacktao.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/stacktao.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    location ~ ^/(admin|api|site)(/|$) {
        proxy_pass http://127.0.0.1:15174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Stacktao-Client-IP $remote_addr;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }
    location ~ /\. { deny all; }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    access_log /www/wwwlogs/stacktao.cn.log;
    error_log /www/wwwlogs/stacktao.cn.error.log;
}
